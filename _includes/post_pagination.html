{% include base_path %}

<style>
  .post-nav {
    --nav-accent: var(--pub-accent, #38bdf8);
    --nav-text: var(--pub-text, #f8fafc);
    --nav-muted: var(--pub-muted, #94a3b8);
    --nav-border: var(--pub-border, rgba(255, 255, 255, 0.12));
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    margin: 48px 0 24px;
    padding-top: 24px;
    border-top: 1px solid var(--nav-border);
    clear: both;
  }

  .post-nav[hidden] {
    display: none;
  }

  .post-nav__item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    padding: 14px 18px;
    border: 1px solid var(--nav-border);
    border-radius: 8px;
    text-decoration: none !important;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .post-nav__item--up {
    text-align: center;
    align-items: center;
    justify-content: center;
  }

  .post-nav__item--up .post-nav__title {
    text-transform: capitalize;
  }

  .post-nav__item--up:hover .post-nav__arrow {
    transform: translateY(-3px);
  }

  .post-nav__item--next {
    text-align: right;
    align-items: flex-end;
  }

  .post-nav__label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nav-accent);
  }

  .post-nav__arrow {
    display: inline-block;
    transition: transform 0.15s ease;
  }

  .post-nav__title {
    max-width: 100%;
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--nav-text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .post-nav__title:empty {
    display: none;
  }

  /* Available */
  .post-nav__item:not(.is-disabled):hover,
  .post-nav__item:not(.is-disabled):focus-visible {
    border-color: var(--nav-accent);
    background: rgba(56, 189, 248, 0.08);
  }

  .post-nav__item:not(.is-disabled):focus-visible {
    outline: 2px solid var(--nav-accent);
    outline-offset: 2px;
  }

  .post-nav__item--prev:not(.is-disabled):hover .post-nav__arrow {
    transform: translateX(-3px);
  }

  .post-nav__item--next:not(.is-disabled):hover .post-nav__arrow {
    transform: translateX(3px);
  }

  /* Unavailable */
  .post-nav__item.is-disabled {
    border-style: dashed;
    opacity: 0.45;
    cursor: default;
    user-select: none;
  }

  .post-nav__item.is-disabled .post-nav__label,
  .post-nav__item.is-disabled .post-nav__title {
    color: var(--nav-muted);
    font-weight: 500;
  }

  @media (max-width: 600px) {
    .post-nav {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {

    .post-nav__item,
    .post-nav__arrow {
      transition: none;
    }
  }
</style>

<nav class="post-nav" id="folder-pagination" aria-label="Post navigation" hidden>
  <a id="prev-btn" class="post-nav__item post-nav__item--prev is-disabled" aria-disabled="true">
    <span class="post-nav__label">
      <span class="post-nav__arrow" aria-hidden="true">&larr;</span>
      {{ site.data.ui-text[site.locale].pagination_previous | default: "Previous" }}
    </span>
    <span class="post-nav__title"></span>
  </a>
  <a id="up-btn" href="#" class="post-nav__item post-nav__item--up">
    <span class="post-nav__label">
      <span class="post-nav__arrow" aria-hidden="true">&uarr;</span>
      Back to
    </span>
    <span class="post-nav__title"></span>
  </a>
  <a id="next-btn" class="post-nav__item post-nav__item--next is-disabled" aria-disabled="true">
    <span class="post-nav__label">
      {{ site.data.ui-text[site.locale].pagination_next | default: "Next" }}
      <span class="post-nav__arrow" aria-hidden="true">&rarr;</span>
    </span>
    <span class="post-nav__title"></span>
  </a>
</nav>

{% raw %}
<script>
  document.addEventListener("DOMContentLoaded", async function () {
    const currentPath = decodeURIComponent(window.location.pathname);

    const pathSegments = currentPath.split('/').filter(Boolean);
    if (pathSegments.length < 2) return;
    const parentFolderUrl = '/' + pathSegments.slice(0, -1).join('/') + '/';
    const parentName = pathSegments[pathSegments.length - 2].replace(/[-_]+/g, ' ');

    try {
      const res = await fetch(parentFolderUrl);
      if (!res.ok) return;
      const htmlText = await res.text();

      const upBtn = document.getElementById('up-btn');
      upBtn.href = parentFolderUrl;
      upBtn.querySelector('.post-nav__title').textContent = parentName;
      document.getElementById('folder-pagination').hidden = false;

      const doc = new DOMParser().parseFromString(htmlText, 'text/html');

      const pages = new Map();
      doc.querySelectorAll('a').forEach(a => {
        const href = a.getAttribute('href');
        if (!href || !href.startsWith(parentFolderUrl) || href === parentFolderUrl) return;
        const text = a.textContent.trim();
        if (!pages.has(href) || (!pages.get(href) && text)) pages.set(href, text);
      });

      const uniquePages = [...pages.keys()];
      const currentIndex = uniquePages.findIndex(
        url => currentPath.endsWith(url) || url.endsWith(currentPath)
      );
      if (currentIndex === -1) return;

      const enable = (el, url) => {
        if (!url) return;
        el.href = url;
        el.classList.remove('is-disabled');
        el.removeAttribute('aria-disabled');
        el.querySelector('.post-nav__title').textContent = pages.get(url) || '';
      };

      enable(document.getElementById('prev-btn'), uniquePages[currentIndex - 1]);
      enable(document.getElementById('next-btn'), uniquePages[currentIndex + 1]);
    } catch (err) {
      console.error("Pagination navigation error:", err);
    }
  });
</script>
{% endraw %}
