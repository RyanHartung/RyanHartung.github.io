{% include base_path %}

<style>
  .post-nav {
    --nav-accent:#38bdf8;
    --nav-text: var(--global-text-color);
    --nav-muted: var(--global-text-color-light);
    --nav-border: color-mix(in srgb, var(--global-border-color) 15%, transparent);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    margin: 48px 0 24px;
    padding-top: 24px;
    border-top: 1px solid var(--nav-border);
    clear: both;
  }

  .post-nav[hidden] {
    display: none;
  }

  .post-nav__item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    padding: 14px 18px;
    border: 2px solid var(--nav-border);
    border-radius: 8px;
    text-decoration: none !important;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .post-nav__item--up {
    text-align: center;
    align-items: center;
    justify-content: center;
  }

  .post-nav__item--up .post-nav__title {
    text-transform: capitalize;
  }

  .post-nav__item--up:hover .post-nav__arrow {
    transform: translateY(-3px);
  }

  .post-nav__item--next {
    text-align: right;
    align-items: flex-end;
  }

  .post-nav__label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nav-accent);
  }

  .post-nav__arrow {
    display: inline-block;
    transition: transform 0.15s ease;
  }

  .post-nav__title {
    max-width: 100%;
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--nav-text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .post-nav__title:empty {
    display: none;
  }

  /* Available */
  .post-nav__item:not(.is-disabled):hover,
  .post-nav__item:not(.is-disabled):focus-visible {
    border-color: var(--nav-accent);
    background: rgba(56, 189, 248, 0.08);
  }

  .post-nav__item:not(.is-disabled):focus-visible {
    outline: 2px solid var(--nav-accent);
    outline-offset: 2px;
  }

  .post-nav__item--prev:not(.is-disabled):hover .post-nav__arrow {
    transform: translateX(-3px);
  }

  .post-nav__item--next:not(.is-disabled):hover .post-nav__arrow {
    transform: translateX(3px);
  }

  /* Unavailable */
  .post-nav__item.is-disabled {
    border-style: dashed;
    opacity: 0.45;
    cursor: default;
    user-select: none;
  }

  .post-nav__item.is-disabled .post-nav__label,
  .post-nav__item.is-disabled .post-nav__title {
    color: var(--nav-muted);
    font-weight: 500;
  }

  @media (max-width: 600px) {
    .post-nav {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {

    .post-nav__item,
    .post-nav__arrow {
      transition: none;
    }
  }
</style>

<nav class="post-nav" aria-label="Post navigation" hidden>
  <a class="post-nav__item post-nav__item--prev is-disabled" aria-disabled="true">
    <span class="post-nav__label">
      <span class="post-nav__arrow" aria-hidden="true">&larr;</span>
      {{ site.data.ui-text[site.locale].pagination_previous | default: "Previous" }}
    </span>
    <span class="post-nav__title"></span>
  </a>
  <a href="#" class="post-nav__item post-nav__item--up">
    <span class="post-nav__label">
      <span class="post-nav__arrow" aria-hidden="true">&uarr;</span>
      Back to
    </span>
    <span class="post-nav__title"></span>
  </a>
  <a class="post-nav__item post-nav__item--next is-disabled" aria-disabled="true">
    <span class="post-nav__label">
      {{ site.data.ui-text[site.locale].pagination_next | default: "Next" }}
      <span class="post-nav__arrow" aria-hidden="true">&rarr;</span>
    </span>
    <span class="post-nav__title"></span>
  </a>
</nav>

{% raw %}
<script>
  document.addEventListener("DOMContentLoaded", async function () {
    const navs = [...document.querySelectorAll('.post-nav:not([data-pagination-ready])')];
    if (!navs.length) return;
    navs.forEach(nav => nav.dataset.paginationReady = 'true');

    const normalizePath = (path) => decodeURIComponent(path).replace(/\/+$/, '') || '/';
    const currentPath = normalizePath(window.location.pathname);

    const pathSegments = currentPath.split('/').filter(Boolean);
    if (pathSegments.length < 2) return;
    const parentPath = '/' + pathSegments.slice(0, -1).join('/');
    const parentFolderUrl = parentPath + '/';
    const parentName = pathSegments[pathSegments.length - 2].replace(/[-_]+/g, ' ');

    try {
      const res = await fetch(parentFolderUrl);
      if (!res.ok) return;
      const htmlText = await res.text();

      const doc = new DOMParser().parseFromString(htmlText, 'text/html');

      const pages = new Map();
      doc.querySelectorAll('a').forEach(a => {
        const href = a.getAttribute('href');
        if (!href) return;
        const url = new URL(href, window.location.origin);
        const pagePath = normalizePath(url.pathname);
        if (url.origin !== window.location.origin || !pagePath.startsWith(parentPath + '/')) return;
        const text = a.dataset.paginationTitle || a.textContent.trim();
        if (!pages.has(pagePath) || a.dataset.paginationTitle || (!pages.get(pagePath) && text)) {
          pages.set(pagePath, text);
        }
      });

      const uniquePages = [...pages.keys()];
      const currentIndex = uniquePages.indexOf(currentPath);
      if (currentIndex === -1) return;

      const enable = (el, url) => {
        if (!url) return;
        el.href = url;
        el.classList.remove('is-disabled');
        el.removeAttribute('aria-disabled');
        el.querySelector('.post-nav__title').textContent = pages.get(url) || '';
      };

      navs.forEach(nav => {
        const upBtn = nav.querySelector('.post-nav__item--up');
        upBtn.href = parentFolderUrl;
        upBtn.querySelector('.post-nav__title').textContent = parentName;
        enable(nav.querySelector('.post-nav__item--prev'), uniquePages[currentIndex - 1]);
        enable(nav.querySelector('.post-nav__item--next'), uniquePages[currentIndex + 1]);
        nav.hidden = false;
      });
    } catch (err) {
      console.error("Pagination navigation error:", err);
    }
  });
</script>
{% endraw %}
