<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

{% include comments-providers/scripts.html %}

<!-- GLightbox -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<!-- Copy-code button: CSS is inline here on purpose, so it works regardless of
     whether _sass/*.scss partials are imported into the compiled stylesheet. -->
<style>
    div.highlighter-rouge,
    figure.highlight {
        position: relative;
    }

    .copy-code-button {
        position: absolute;
        top: 0em;
        right: 0em;
        z-index: 10;
        padding: 0.38em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: var(--global-bg-color);
        border: 1px solid var(--global-code-border-color);
        color: var(--global-text-color, #ffffff);
        cursor: pointer;
        font-size: 0.85em;
        line-height: 1;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.15s ease-in-out;
    }

    div.highlighter-rouge:hover .copy-code-button,
    figure.highlight:hover .copy-code-button,
    div.highlighter-rouge:focus-within .copy-code-button,
    figure.highlight:focus-within .copy-code-button {
        opacity: 0.85;
        visibility: visible;
    }

    .copy-code-button:hover {
        opacity: 1;
        color: #ee52b8;
        background: #ffffff;
    }

    .copy-code-button:focus {
        outline: none;
    }

    .copy-code-button::after {
        content: attr(aria-label);
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 0.4em;
        padding: 0.35em 0.6em;
        background-color: var(--global-bg-color);
        border: 1px solid var(--global-code-border-color);
        color: var(--global-text-color, #ffffff);
        font-size: 0.75em;
        line-height: 1.2;
        white-space: nowrap;
        border-radius: 3px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.15s ease-in-out;
        z-index: 20;
    }

    .copy-code-button:hover::after {
        opacity: 1;
        visibility: visible;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        try {
            GLightbox({ selector: '.glightbox' });
        } catch (err) {
            console.error('GLightbox failed to initialize:', err);
        }

        try {
            const codeBlocks = document.querySelectorAll('div.highlighter-rouge, figure.highlight');
            console.log('[copy-code] found', codeBlocks.length, 'code block(s)');

            const clipboardIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        </svg>`;

            const checkIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>`;

            codeBlocks.forEach((block) => {
                const copyBtn = document.createElement('button');
                copyBtn.type = 'button';
                copyBtn.className = 'copy-code-button';
                copyBtn.setAttribute('aria-label', 'Copies code to clipboard');
                copyBtn.innerHTML = clipboardIcon;

                copyBtn.addEventListener('click', async () => {
                    const codeElement = block.querySelector('code') || block.querySelector('.highlight pre');
                    const codeText = codeElement ? codeElement.innerText : '';

                    try {
                        await navigator.clipboard.writeText(codeText);
                        copyBtn.innerHTML = checkIcon;
                        setTimeout(() => {
                            copyBtn.innerHTML = clipboardIcon;
                        }, 2000);
                    } catch (err) {
                        console.error('Failed to copy: ', err);
                    }
                });

                block.appendChild(copyBtn);
            });
        } catch (err) {
            console.error('[copy-code] setup failed:', err);
        }
    });
</script>
